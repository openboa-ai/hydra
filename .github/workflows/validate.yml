name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  openboa-governance:
    name: openboa-governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate the portable package boundary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          portable = json.loads((root / 'plugin.json').read_text())
          codex = json.loads((root / '.codex-plugin/plugin.json').read_text())
          allowed = {
              '$schema', 'name', 'version', 'description', 'author',
              'homepage', 'repository', 'license', 'keywords', 'extensions'
          }
          assert set(portable) <= allowed, sorted(set(portable) - allowed)
          assert portable['name'] == codex['name'] == 'hydra'
          assert portable['version'] == codex['version'] == '0.0.0'
          assert portable['$schema'].endswith('/schemas/1.0.0/plugin.schema.json')
          for path in ('skills', 'mcp.json', 'hooks', '.mcp.json', '.app.json'):
              assert not (root / path).exists(), path
          assert not (root / 'evals').exists()
          assert not (root / 'results').exists()
          PY
          python3 - <<'PY'
          from pathlib import Path

          forbidden = ("openboa-" + "operations", "openboa-" + "ai-native-" + "sdlc")
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              text = path.read_text(errors='ignore')
              assert not any(value in text for value in forbidden), path
          PY

  openboa-candidate:
    name: openboa-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check candidate hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if git rev-parse --verify "$BASE_SHA^{commit}" >/dev/null 2>&1; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check HEAD^ HEAD
          fi
          test -f README.md
          test -f DESIGN.md
          test -f EVALUATION.md
          test -f SUPPORT.md
          test -f RELEASING.md
          test -f SECURITY.md
          ! find . -type f -not -path './.git/*' -size +2M -print -quit | grep -q .
