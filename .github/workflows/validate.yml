name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ai_native_sdlc:
    name: openboa-ai-native-sdlc
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate repository contract
        run: python3 scripts/validate_hydra.py .
      - name: Validate research evidence
        run: python3 scripts/validate_research.py .
      - name: Run contract tests
        run: python3 -m unittest discover -s tests -v

  # Keep the old required-check name until a human updates the GitHub ruleset.
  required-check-compatibility:
    name: openboa-governance
    needs: ai_native_sdlc
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Mirror the AI-Native SDLC validation result
        env:
          VALIDATION_RESULT: ${{ needs.ai_native_sdlc.result }}
        run: test "$VALIDATION_RESULT" = "success"
