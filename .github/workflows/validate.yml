name: validate

# Compatibility/bootstrap check for the current candidate. Keep the required
# context `openboa-governance`, but do not treat this candidate-controlled job
# as a trusted base- or ruleset-controlled policy workflow.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: openboa-governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Record candidate and event revisions
        env:
          CANDIDATE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_REVISION: ${{ github.sha }}
        run: |
          printf 'candidate_revision=%s\n' "$CANDIDATE_REVISION"
          printf 'event_revision=%s\n' "$EVENT_REVISION"
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate repository contract
        run: python3 scripts/validate_hydra.py .
      - name: Run contract tests
        run: python3 -m unittest discover -s tests -v
