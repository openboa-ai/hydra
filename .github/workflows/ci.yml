name: Repository CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repository-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    name: Kernel tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14.2']
    steps:
      - name: Check out merge candidate or main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up bounded execution test Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Verify Python and bounded execution contracts
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 11)'
          python3 -m pip install '.[mcp]'
          python3 -m unittest discover -s tests -v
  mac-app:
    name: Mac app checks
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: apps/mac
    env:
      RUSTUP_TOOLCHAIN: '1.94.1'
    steps:
      - name: Check out merge candidate or main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Test frontend behavior and bundled assets
        run: npm test
      - name: Verify the published theme mapping
        run: npm run verify:theme
      - name: Typecheck and build the frontend
        run: npm run build
      - name: Set up the verified Rust toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustc --version
          cargo --version
      - name: Test the Rust bridge with locked dependencies
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build the native app with embedded frontend assets
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --features custom-protocol
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out immutable shared tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openboa-ai/.github
          ref: 700dacb7d811a080cb49bb4a81a9d5f437d697fd
          persist-credentials: false
          path: controls
      - name: Check out PR merge candidate or main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHECKED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$CHECKED_SHA"
          if test "$BASE_SHA" = 0000000000000000000000000000000000000000; then
            BASE_SHA="$(git -C candidate hash-object -t tree /dev/null)"
          fi
          mkdir -p candidate/.git/info
          printf '%s\n' '* diff whitespace=blank-at-eol,blank-at-eof,space-before-tab' > candidate/.git/info/attributes
          # Classify only reviewed original binary assets; candidate attributes and
          # manifests cannot add exceptions. Check both sides, including deletions.
          while read -r asset_path expected_sha256; do
            present=false
            for revision in "$BASE_SHA" "$CHECKED_SHA"; do
              entry="$(git -C candidate ls-tree "$revision" -- "$asset_path")"
              if test -z "$entry"; then
                continue
              fi
              present=true
              IFS=$'\t' read -r metadata object_path <<< "$entry"
              read -r mode object_type object_id extra <<< "$metadata"
              if test "$mode" != 100644 || test "$object_type" != blob ||
                 test "$object_path" != "$asset_path" || test -n "$extra" ||
                 test "${entry#*$'\n'}" != "$entry"; then
                printf 'Unexpected asset object: %s\n' "$asset_path" >&2
                exit 1
              fi
              actual_sha256="$(git -C candidate cat-file blob "$object_id" | sha256sum)"
              if test "${actual_sha256%% *}" != "$expected_sha256"; then
                printf 'Unreviewed asset bytes: %s\n' "$asset_path" >&2
                exit 1
              fi
            done
            if test "$present" = true; then
              printf '%s -diff\n' "$asset_path" >> candidate/.git/info/attributes
            fi
          done <<'VERIFIED_ASSETS'
          apps/mac/public/fonts/MartianGrotesk-wdth-wght.ttf f81807163c34ff754e6d915b0b59f76cca88332b67c45cfc7453ace5751ae912
          apps/mac/public/fonts/PretendardVariable.woff2 9599f12fd42fc0bce1cd50b47a0c022e108d7aa64dd0d1bb0ed44f3282d900b4
          apps/mac/src-tauri/icons/icon.png 005be38b40da8a96037bc632b6f2c3ff48028d007b9e959dc9ed2a6543c3580c
          VERIFIED_ASSETS
          git -C candidate diff --check --no-renames --no-ext-diff --no-textconv "$BASE_SHA" "$CHECKED_SHA" --
      - name: Install pinned workflow linter
        run: bash controls/.github/scripts/install-actionlint.sh
      - name: Validate workflows as data
        run: |
          set -euo pipefail
          for directory in candidate candidate/.github candidate/.github/workflows; do
            test -d "$directory" && test ! -L "$directory" || exit 1
          done
          shopt -s nullglob dotglob
          workflows=(candidate/.github/workflows/*.yml candidate/.github/workflows/*.yaml)
          test "${#workflows[@]}" -gt 0
          lint_config="$(mktemp "${RUNNER_TEMP:?}/actionlint.XXXXXX")"
          printf '{}\n' > "$lint_config"
          for workflow in "${workflows[@]}"; do
            test -f "$workflow" && test ! -L "$workflow" || exit 1
            actionlint -config-file "$lint_config" -shellcheck= -pyflakes= - < "$workflow"
          done
      - name: Install pinned secret scanner
        run: bash controls/.github/scripts/install-gitleaks.sh
      - name: Scan history and source with trusted rules
        run: |
          set -euo pipefail
          # Git history scans also load the repository's ignore fingerprints.
          if test -e candidate/.gitleaksignore || test -L candidate/.gitleaksignore; then
            printf '%s\n' 'Candidate .gitleaksignore is not permitted by the trusted secret scan.' >&2
            exit 1
          fi
          gitleaks git --config "$GITLEAKS_TRUSTED_CONFIG" --gitleaks-ignore-path /dev/null --ignore-gitleaks-allow --redact --no-banner candidate
          gitleaks dir --config "$GITLEAKS_TRUSTED_CONFIG" --gitleaks-ignore-path /dev/null --ignore-gitleaks-allow --redact --no-banner candidate
