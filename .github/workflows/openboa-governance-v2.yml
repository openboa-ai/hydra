name: openboa-governance-v2

# Post-merge bootstrap workflow for the future ruleset-required trusted check.
# It intentionally runs only after the trusted validator has landed on `main`;
# the existing `openboa-governance` job remains the required pull-request
# compatibility check until a separately approved canary replaces it.
# The validator uses recorded revisions when they are present and the moving
# trusted `main` checkout only as validator code.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: openboa-governance-v2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Record revisions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          printf 'base_sha=%s\n' "$BASE_SHA"
          printf 'head_sha=%s\n' "$HEAD_SHA"
          printf 'event_sha=%s\n' "$EVENT_SHA"
      - name: Check out trusted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: openboa-ai/hydra
          ref: main
          path: trusted-source
          fetch-depth: 1
      - name: Check out recorded base as data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          path: base
          fetch-depth: 1
      - name: Check out candidate as data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          fetch-depth: 1
      - name: Validate trusted source
        run: python3 trusted-source/scripts/validate_hydra.py trusted-source
      - name: Validate candidate with trusted source
        run: python3 trusted-source/scripts/validate_hydra.py candidate
      - name: Run trusted governance checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          test -f trusted-source/scripts/validate_governance.py
          python3 trusted-source/scripts/validate_governance.py \
            --trusted-source trusted-source \
            --base base \
            --candidate candidate \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA"
