schema: 1
contract: "0.1.0"
profile: public-standard

github:
  control_plane: codex-github-connector
  scope_key: workspace/repository/goal
  account_is_not_authority: true
  cli_fallback: human-gated

# This profile is a portable baseline. A repository may strengthen it locally.
human_gate:
  owner: SonSangjoon
  paths:
    - .github/workflows/**
    - .github/CODEOWNERS
    - SECURITY.md
    - AGENTS.md
    - .agents/**
    - .codex-plugin/**

required_checks:
  - openboa-governance

environments:
  major_change: openboa-major-change

merge:
  strategy: squash
  auto_merge: true
  delete_branch_on_merge: true

labels:
  - status:backlog
  - status:ready
  - status:in-progress
  - status:in-review
  - blocked
  - delegate:codex
  - risk:routine
  - risk:human-gate
  - governance:exception
