# Replace example identities with live observations before registration.
version = 1
repository_id = 123
authorized_actors = ["openboa"]
human_reviewers = ["product-owner"]
spec_directory = "docs/engineering"
allowed_paths = ["src/", "tests/", "docs/", "README.md", "CONTRIBUTING.md"]
protected_paths = ["tests/holdout/", "evaluation/criteria/"]
ui_paths = ["src/ui/"]

[labels]
ready = "hydra:ready"
paused = "hydra:paused"
decision = "hydra:decision"

[[verification]]
argv = ["python3", "-m", "unittest", "discover", "-s", "tests"]
cwd = "."
timeout = 300

[[required_checks]]
workflow_id = 123
workflow_path = ".github/workflows/ci.yml"
job = "Unit tests"
events = ["pull_request", "push"]
app_id = 15368

[review_provider]
login = "chatgpt-codex-connector[bot]"
user_id = 199175422
app_id = 1144995
format = "codex_summary_v1"

[delivery]
automatic_merge = false
production_effect = true
