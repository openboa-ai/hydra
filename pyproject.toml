[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openboa-hydra-sdlc"
dynamic = ["version"]
description = "GitHub-native coordination for Codex software development"
requires-python = ">=3.11"
dependencies = ["markdown-it-py==4.2.0"]

[project.optional-dependencies]
codex = ["openai-codex==0.162.0"]
mcp = ["mcp==2.3.0"]

[project.scripts]
hydra = "hydra_sdlc.cli:main"
hydra-mcp = "hydra_sdlc.mcp:main"

[tool.setuptools.packages.find]
include = ["hydra_sdlc*"]

[tool.setuptools.dynamic]
version = {attr = "hydra_sdlc.__version__"}
