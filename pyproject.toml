[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openboa-hydra-sdlc"
version = "0.1.0"
description = "GitHub-native coordination for Codex software development"
requires-python = ">=3.11"

[project.optional-dependencies]
codex = ["openai-codex==0.162.0"]

[project.scripts]
hydra = "hydra_sdlc.cli:main"

[tool.setuptools.packages.find]
include = ["hydra_sdlc*"]
